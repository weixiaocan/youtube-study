<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 学习记录</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <div class="app-top">
      <header class="header">
        <div class="header-top">
          <span id="save-status" class="status-chip idle">未读取</span>
          <button id="clean-cache-button" class="cache-button" type="button">清理过期缓存</button>
        </div>

        <div class="header-actions">
          <button id="save-to-vault-button" class="primary-button" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0 3-3m-3 3L7 9M4 14.5v1.5h12v-1.5"/></svg>
            <span>保存到知识库</span>
          </button>
          <button id="load-transcript-button" class="secondary-button" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 7A6 6 0 1 0 16 12m0-5V3.5M16 7h-3.5"/></svg>
            <span>获取字幕</span>
          </button>
        </div>
      </header>

      <nav class="tabs" aria-label="内容区域">
        <button class="tab active" data-tab="transcript">
          <span>跟读字幕</span><span id="transcript-count" class="tab-count">0</span>
        </button>
        <button class="tab" data-tab="records">
          <span>学习笔记</span><span id="record-count" class="tab-count">0</span>
        </button>
        <button id="practice-entry" class="practice-entry" type="button" aria-label="打开听力练习">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5v11l9-5.5z"/></svg>
          <span>听力练习</span>
        </button>
      </nav>
    </div>

    <main>
      <section id="empty-state" class="empty-state">
        <div class="empty-note">
          <div class="empty-icon" aria-hidden="true">▶</div>
          <p>打开一条带字幕的 YouTube 视频，开始边看边学。</p>
          <span>字幕只在你主动获取后读取，内容也只在你确认后进入知识库。</span>
        </div>
      </section>

      <section id="transcript-panel" class="panel hidden" aria-label="视频字幕">
        <div id="transcript-empty" class="transcript-empty hidden">
          <div class="empty-kicker">READY WHEN YOU ARE</div>
          <h2>先看一会儿，再决定是否读取</h2>
          <p>需要时再获取字幕，不会因为你随手打开视频就自动保存。</p>
          <button id="load-transcript-cta">获取当前视频字幕</button>
        </div>
        <div class="transcript-toolbar hidden" id="transcript-toolbar">
          <input id="transcript-search" class="transcript-search" type="search"
            placeholder="搜索字幕…" aria-label="搜索字幕" autocomplete="off">
        </div>
        <div id="transcript-list" class="transcript-list"></div>
      </section>

      <section id="records-panel" class="panel hidden" aria-label="学习笔记">
        <div id="records-list" class="records-list"></div>
      </section>

      <section id="practice-view" class="panel practice-view hidden" aria-label="听力练习">
        <div class="practice-view-head">
          <button id="practice-back" class="practice-back" type="button" aria-label="返回字幕笔记">← 返回</button>
          <div class="practice-heading">
            <div class="practice-kicker">LISTENING PRACTICE</div>
            <div class="practice-title">听力练习</div>
          </div>
        </div>

        <div id="practice-list-head" class="practice-list-head hidden">
          <span>围绕你的学习笔记自动切出的片段，点任意一条开始练习</span>
        </div>
        <div id="practice-empty" class="practice-empty hidden">
          <p>还没有可练习的片段</p>
          <span>先在「学习笔记」里记下几条笔记，系统会围绕每条笔记的时间点自动切出约 1 分钟的完整片段。</span>
        </div>
        <div id="practice-list" class="practice-list hidden"></div>

        <div id="practice-panel" class="practice-panel hidden">
          <div class="practice-nav-row">
            <span id="practice-counter" class="practice-counter"></span>
            <span id="practice-range" class="practice-range"></span>
          </div>

          <div class="practice-main-controls">
            <button id="practice-playpause" class="practice-playpause primary-button" type="button">播放</button>
            <button id="practice-repeat" class="practice-repeat secondary-button" type="button">再听一次</button>
          </div>

          <div class="practice-secondary-controls">
            <div class="practice-rate-group" role="group" aria-label="播放速度">
              <button class="practice-rate" type="button" data-rate="0.8">0.8×</button>
              <button class="practice-rate active" type="button" data-rate="1">1.0×</button>
              <button class="practice-rate" type="button" data-rate="1.25">1.25×</button>
            </div>
            <button id="practice-subtitle-toggle" class="secondary-button" type="button">字幕关</button>
          </div>

          <div id="practice-subtitles" class="practice-subtitles hidden" aria-label="当前片段字幕"></div>

          <div class="practice-divider" role="presentation"></div>

          <div class="shadowing-panel">
            <button id="shadowing-toggle" class="shadowing-toggle secondary-button" type="button">开始跟读练习</button>
            <div id="shadowing-body" class="shadowing-body hidden">
              <div class="shadowing-head">
                <span id="shadowing-progress" class="shadowing-progress"></span>
                <button id="shadowing-listen" class="secondary-button" type="button">听原声</button>
                <button id="shadowing-next" class="primary-button" type="button">下一句</button>
              </div>
              <div id="shadowing-sentence" class="shadowing-sentence"></div>
              <div id="shadowing-status" class="shadowing-status" aria-live="polite"></div>
            </div>
          </div>

          <div class="practice-footer">
            <button id="practice-prev" class="secondary-button" type="button">← 上一个</button>
            <button id="practice-next" class="secondary-button" type="button">下一个 →</button>
          </div>
        </div>
      </section>
    </main>

    <section id="composer" class="composer" aria-label="学习记录编辑器">
      <div class="composer-topline">
        <div class="composer-heading">
          <span class="composer-dot" aria-hidden="true"></span>
          <span id="composer-title">记录此刻</span>
        </div>
        <span id="draft-time" class="time-chip"></span>
      </div>
      <div id="draft-text" class="composer-quote"></div>
      <div class="composer-media-row">
        <button id="add-screenshots-button" class="media-button" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h14v11H3zM6 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm-2 6 3.5-3.5 2.5 2 2-2 4 3.5"/></svg>
          添加截图
        </button>
        <span id="screenshot-hint">支持多选、拖入或粘贴</span>
        <input id="screenshot-input" type="file" accept="image/*" multiple hidden>
      </div>
      <div id="screenshot-preview-list" class="screenshot-preview-list hidden" aria-label="待保存截图"></div>
      <textarea id="draft-note" rows="3" placeholder="这里写你的理解、问题或灵感……"></textarea>
      <div class="composer-actions">
        <span class="keyboard-hint"><kbd>Enter</kbd> 保存　<kbd>Alt</kbd> + <kbd>N</kbd> 快速记录</span>
        <div class="composer-action-buttons">
          <button id="cancel-edit-button" class="cancel-edit-button hidden">取消</button>
          <button id="save-button">保存笔记</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
